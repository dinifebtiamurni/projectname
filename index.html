
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biodata Dini</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #fce4ec, #e1f5fe);
    min-height: 100vh;
    padding: 30px 15px;
    color: #333;
}

.container {
    max-width: 700px;
    margin: auto;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
}

header {
    background: linear-gradient(135deg, #ec407a, #ab47bc);
    color: white;
    text-align: center;
    padding: 35px 20px;
}

header h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

header p {
    font-size: 15px;
}

.profile {
    text-align: center;
    padding: 30px 20px;
}

.profile img {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid #f48fb1;
    margin-bottom: 15px;
}

.profile h2 {
    color: #d81b60;
    font-size: 25px;
}

.content {
    padding: 10px 30px 30px;
}

.card {
    background: #fff5f8;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

.card h3 {
    color: #c2185b;
    border-bottom: 2px solid #f48fb1;
    padding-bottom: 10px;
    margin-bottom: 15px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

td {
    padding: 12px 5px;
    border-bottom: 1px solid #f3d5df;
}

td:first-child {
    font-weight: bold;
    width: 35%;
    color: #880e4f;
}

.hobi {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.hobi span {
    background: #f8bbd0;
    color: #880e4f;
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 14px;
}

footer {
    background: #ad1457;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 14px;
}

@media(max-width: 500px) {
    header h1 {
        font-size: 26px;
    }

    .content {
        padding: 10px 15px 20px;
    }

    td {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header>
        <h1>BIODATA DIRI</h1>
        <p>Profil Pribadi</p>
    </header>

    <section class="profile">

        <img src="foto.jpg" alt="Foto Dini">

        <h2>Dini</h2>
        <p>Selamat Datang di Biodata Saya</p>

    </section>

    <div class="content">

        <!-- DATA PRIBADI -->
        <section class="card">

            <h3>Data Pribadi</h3>

            <table>
                <tr>
                    <td>Nama</td>
                    <td>: Dini</td>
                </tr>

                <tr>
                    <td>Alamat</td>
                    <td>: Isi alamat kamu</td>
                </tr>

                <tr>
                    <td>Asal Sekolah</td>
                    <td>: Isi nama sekolah kamu</td>
                </tr>

                <tr>
                    <td>Hobi</td>
                    <td>: Membaca, Menulis, dan Musik</td>
                </tr>
            </table>

        </section>

        <!-- HOBI -->
        <section class="card">

            <h3>Hobi Saya</h3>

            <div class="hobi">
                <span>📚 Membaca</span>
                <span>✍️ Menulis</span>
                <span>🎵 Mendengarkan Musik</span>
            </div>

        </section>

    </div>

    <footer>
        <p>&copy; 2026 Biodata Dini</p>
        <p>Dibuat dengan HTML dan CSS</p>
    </footer>

</div>

</body>
</html
